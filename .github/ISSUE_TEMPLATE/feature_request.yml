name: 功能建议
description: 说明现有功能无法满足的场景，并提出改进建议。
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读[贡献指南](https://github.com/mofan6/Moect/blob/main/CONTRIBUTING.md)，搜索已有讨论。
        大功能、新平台、核心重写、重要依赖或联网行为变更，请先讨论范围与方案，再投入开发。提出建议不代表已经排期或承诺实现。
        文本、截图和样例请使用虚构数据，不要公开聊天记录、账号信息、密钥或其他个人信息。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索已有 Issue，包括已关闭项，未找到能够直接补充的相同讨论。
          required: true
        - label: 我已检查文本和附件，未包含真实聊天数据、密钥、账号凭据或其他未脱敏的个人信息。
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 遇到的困难与使用场景
      description: 你实际想完成什么？现有功能或操作方式有什么不足？请说明需求，无需提供私人聊天内容。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望增加或改变的行为
      description: 描述期望的操作和结果；有多个独立建议时请分别提交。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案（可选）
      description: 是否能通过现有功能、导出后处理或其他方式满足需求？
  - type: textarea
    id: context
    attributes:
      label: 补充信息与实现意愿（可选）
      description: 可填写相关版本、公开参考链接、虚构数据的示意图，以及是否愿意在方案讨论后提交 PR。引用他人成果请注明来源。
